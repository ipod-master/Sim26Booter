name: Build Sim26Booter

on:
  workflow_dispatch:

jobs:
  build_package:
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos Toolchain
        run: |
          git clone --recursive https://github.com/theos/theos $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Compile Package Artifact
        run: |
          make package THEOS=$HOME/theos FINALPACKAGE=1 ARCHS="arm64"
          
      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Sim26Booter-Package
          path: packages/*.deb
